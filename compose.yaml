# Dateibasierte Compose-Version (Caddyfile daneben). NAS-Port 443 muss frei sein.
name: hom
services:
  app:
    image: ghcr.io/kesselbuettner-dot/hom:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "4317"
      HOST: "0.0.0.0"
      HOM_ALLOWED_ORIGINS: "https://villa-kunterbunt.net"
      HOM_PASSWORD_HASH: ${HOM_PASSWORD_HASH:?Bitte Passwort-Hash in .env hinterlegen}
      HAUSKOSTEN_DATA: /app/data
    volumes:
      - hom_data:/app/data
    networks:
      - hom_internal
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - hom_caddy_data:/data
      - hom_caddy_config:/config
    networks:
      - hom_internal
networks:
  hom_internal:
    driver: bridge
volumes:
  hom_data:
  hom_caddy_data:
  hom_caddy_config:
