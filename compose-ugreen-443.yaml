# Für https://villa-kunterbunt.net OHNE Portnummer. Host-Port 443 MUSS FREI SEIN.
# Direkt im UGREEN-Docker-Projekt als YAML verwenden.
# Docker Compose >= 2.23.1 erforderlich (inline configs: content).
# Vorher: öffentlicher GHCR-Pull und lokale .env mit HOM_PASSWORD_HASH.
services:
  app:
    image: ghcr.io/kesselbuettner-dot/hom:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "4317"
      HOST: "0.0.0.0"
      HOM_ALLOWED_ORIGINS: "https://villa-kunterbunt.net"
      HAUSKOSTEN_DATA: /app/data
    volumes:
      - hom_data:/app/data
    networks:
      - hom_internal
    security_opt:
      - no-new-privileges:true

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      HOM_PASSWORD_HASH: ${HOM_PASSWORD_HASH:?Bitte HOM_PASSWORD_HASH in .env hinterlegen}
    ports:
      - "443:443"
    configs:
      - source: hom_caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - hom_caddy_data:/data
      - hom_caddy_config:/config
    networks:
      - hom_internal
    security_opt:
      - no-new-privileges:true

configs:
  hom_caddyfile:
    content: |
      villa-kunterbunt.net {
          tls internal
          encode gzip
          basic_auth {
              hom {$$HOM_PASSWORD_HASH}
          }
          reverse_proxy app:4317 {
              header_up Host localhost:4317
          }
      }

networks:
  hom_internal:
    driver: bridge

volumes:
  hom_data:
  hom_caddy_data:
  hom_caddy_config:
