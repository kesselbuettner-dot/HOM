# DXP2800 – YAML direkt im UGREEN Docker-Projekt HOM einfügen.
# HTTPS 443. Das bestehende HOM_PASSWORD_HASH in .env bleibt unverändert.
# Prüfen: Port 443 muss frei sein, keine Portfreigabe ins Internet.
name: hom

services:
  app:
    image: ghcr.io/kesselbuettner-dot/hom:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "4317"
      HOST: "0.0.0.0"
      HOM_ALLOWED_ORIGINS: "https://villa-kunterbunt.net"
      HOM_PASSWORD_HASH: ${HOM_PASSWORD_HASH:?Bitte Passwort-Hash in .env hinterlegen}
      HAUSKOSTEN_DATA: /app/data
    volumes:
      - hom_data:/app/data
    networks:
      - hom_internal
    security_opt:
      - no-new-privileges:true

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "443:443"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        cat > /tmp/HOM.Caddyfile <<'CADDY'
        https://villa-kunterbunt.net {
            tls internal
            encode gzip
            reverse_proxy app:4317 {
                header_up Host localhost:4317
            }
        }
        CADDY
        exec caddy run --config /tmp/HOM.Caddyfile --adapter caddyfile
    volumes:
      - hom_caddy_data:/data
      - hom_caddy_config:/config
    networks:
      - hom_internal
    security_opt:
      - no-new-privileges:true

networks:
  hom_internal:
    driver: bridge

volumes:
  hom_data:
  hom_caddy_data:
  hom_caddy_config:
